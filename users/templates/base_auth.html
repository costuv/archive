<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ArchIve{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Architects Daughter", cursive, sans-serif;
      }
      input,
      button {
        font-family: inherit;
      }
    </style>
  </head>
  <body
    class="bg-white dark:bg-zinc-950 min-h-screen w-screen flex flex-col items-center justify-center text-black dark:text-white select-none antialiased relative p-4 transition-colors duration-200"
  >
    <div class="flex flex-col items-center w-full max-w-md pb-16">
      <div class="text-[54px] font-bold tracking-wide mb-10 text-black dark:text-white">
        <span class="text-red-600 dark:text-red-500">A</span>rch<span class="text-red-600 dark:text-red-500">i</span>ve
      </div>

      <div class="w-full flex flex-col">
        <a href="/" class="text-xl mb-2 text-black dark:text-white hover:opacity-70 transition-opacity">
          &lt; Back to Archive
        </a>

        <div
          class="border-[4px] border-black dark:border-white bg-white dark:bg-zinc-900 p-8 sm:p-10 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] dark:shadow-[12px_12px_0px_0px_rgba(255,255,255,1)] flex flex-col text-black dark:text-white transition-all"
        >
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>

    <div class="absolute bottom-10 text-2xl sm:text-[32px] tracking-wide text-black dark:text-white/80">
      By Kaustuv :)
    </div>
  </body>
</html>
